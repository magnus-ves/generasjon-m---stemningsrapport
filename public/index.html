<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000057">
<title>Stemningsrapport – Generasjon M</title>
<link rel="icon" href="/img/logo-pos.svg">
<link rel="stylesheet" href="/style.css">
<style>
  body{min-height:100dvh}
  .app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
  header.top{padding:18px 20px 14px;display:flex;flex-direction:column;gap:14px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:2}
  .progress{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
  .progress div{height:6px;border-radius:3px;background:var(--line)}
  .progress div.on{background:var(--blue)}
  main{flex:1;padding:22px 20px 28px}
  footer.bottom{padding:12px 20px calc(16px + env(safe-area-inset-bottom));display:flex;gap:10px;border-top:1px solid var(--line);background:var(--bg);position:sticky;bottom:0}
  .faces{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="row" style="justify-content:space-between">
      <img src="/img/logo-pos.svg" alt="Generasjon M" style="height:20px">
      <span id="steplabel" class="small muted" style="font-weight:600"></span>
    </div>
    <div class="progress" id="progress" aria-hidden="true"><div></div><div></div><div></div><div></div><div></div></div>
  </header>
  <main id="main" aria-live="polite"></main>
  <footer class="bottom" id="footer"></footer>
</div>
<script src="/vendor/supabase.js"></script>
<script src="/config.js"></script>
<script src="/rapport.js"></script>
</body>
</html>
