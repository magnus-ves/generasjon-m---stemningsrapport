<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000057">
<title>Admin – Generasjon M</title>
<link rel="icon" href="/img/logo-pos.svg">
<link rel="stylesheet" href="/style.css">
<style>
  .shell{display:flex;flex-wrap:wrap;min-height:100vh}
  nav.side{flex:1 1 240px;max-width:100%;background:var(--navy);color:#fff;padding:24px 18px;display:flex;flex-direction:column;gap:22px}
  nav.side button.tab{min-height:46px;padding:0 16px;border-radius:14px;border:none;text-align:left;background:transparent;color:#fff;font-size:15px;font-weight:700;width:100%}
  nav.side button.tab[aria-current="page"]{background:var(--blue)}
  main.content{flex:999 1 560px;min-width:0;padding:32px 28px 56px}
  .inner{max-width:1100px;display:flex;flex-direction:column;gap:24px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr));gap:12px}
  .kpi{padding:18px;border-radius:18px;background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
  .kpi .v{font-size:36px;font-weight:900;line-height:1}
  .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(480px,100%),1fr));gap:20px;align-items:start}
  .weeks{display:flex;align-items:flex-end;gap:6px;height:160px;padding-top:10px}
  .weeks .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
  .weeks .b{width:100%;max-width:36px;background:var(--blue);border-radius:6px 6px 0 0}
  .weeks .l{font-size:11px;color:var(--muted);white-space:nowrap}
  .login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--navy)}
  details.visit summary{cursor:pointer;list-style:none}
  details.visit summary::-webkit-details-marker{display:none}
  .kv{display:grid;grid-template-columns:minmax(140px,220px) 1fr;gap:6px 16px;font-size:14px}
  .kv dt{color:var(--muted);font-weight:600}
  .kv dd{margin:0;white-space:pre-line}
</style>
</head>
<body>
<div id="root"></div>
<script src="/vendor/auth0-spa-js.js"></script>
<script src="/vendor/supabase.js"></script>
<script src="/config.js"></script>
<script src="/admin.js"></script>
</body>
</html>
